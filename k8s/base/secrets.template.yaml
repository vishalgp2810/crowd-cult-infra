apiVersion: v1
kind: Secret
metadata:
  name: crowd-cult-backend-secret
type: Opaque
stringData:
  # With Cloud SQL Auth Proxy sidecar: 127.0.0.1. Local dev: 127.0.0.1 while proxy runs, or Cloud SQL public IP (not recommended).
  DATABASE__DB_HOST: "127.0.0.1"
  DATABASE__DB_PORT: "3306"
  DATABASE__DB_NAME: REPLACE_DB_NAME
  DATABASE__DB_USER: REPLACE_DB_USER
  DATABASE__DB_PASS: REPLACE_DB_PASS
  DATABASE__DB_DIALECT: mysql
  # GCS: leave KEY_FILENAME empty on GKE and use Workload Identity. Grant the same GSA as backend WI
  # (e.g. crowd-cult-sql-proxy@PROJECT.iam.gserviceaccount.com) roles/storage.objectAdmin on the bucket
  # and roles/iam.serviceAccountTokenCreator on itself for signed URLs.
  GCP__PROJECT_ID: REPLACE_GCP_PROJECT_ID
  GCP__STORAGE_BUCKET: REPLACE_GCS_BUCKET
  GCP__KEY_FILENAME: ""
  # Same email as backend WI GSA (metadata iam.gke.io/gcp-service-account). Required for V4 signed URLs on GKE.
  GCP__SIGNING_SERVICE_ACCOUNT: REPLACE_WORKLOAD_IDENTITY_GSA_EMAIL
  JWT__JWT_SECRET: REPLACE_JWT_SECRET_MIN_32_CHARS
  JWT__EXPIRES_IN: "8h"
  ENCRYPTION__KEY: REPLACE_ENCRYPTION_KEY_32_CHARS_MIN
  GOOGLE_AUTH__CLIENT_ID: REPLACE_GOOGLE_CLIENT_ID
  GOOGLE_AUTH__CLIENT_SECRET: REPLACE_GOOGLE_CLIENT_SECRET
  GOOGLE_AUTH__CALLBACK_URL: https://api.crowdandcult.com/auth/google/callback
  GOOGLE_AUTH__FRONTEND_BASE_URL: https://crowdandcult.com
  EMAIL__HOST: REPLACE_SMTP_HOST
  EMAIL__PORT: "587"
  EMAIL__USER: REPLACE_SMTP_USER
  EMAIL__PASS: REPLACE_SMTP_PASS
  EMAIL__FROM: noreply@crowdandcult.com
  EMAIL__FROM_NAME: Crowd and Cult
