apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd-cult-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowd-cult-backend
  template:
    metadata:
      labels:
        app: crowd-cult-backend
    spec:
      serviceAccountName: crowd-cult-backend-sa
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - "--structured-logs"
            - "--port=3306"
            - "crowdandcult-prod:asia-south1:crowd-cult-prod-sql"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: backend
          image: asia-south1-docker.pkg.dev/crowdandcult-prod/crowd-cult-backend/crowd-cult-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: crowd-cult-backend-config
            - secretRef:
                name: crowd-cult-backend-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "400m"
              memory: "384Mi"
