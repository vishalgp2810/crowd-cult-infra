apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowd-cult-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowd-cult-frontend
  template:
    metadata:
      labels:
        app: crowd-cult-frontend
    spec:
      containers:
        - name: frontend
          image: asia-south1-docker.pkg.dev/crowdandcultprod/crowd-cult-frontend/crowd-cult-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: crowd-cult-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "80m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
