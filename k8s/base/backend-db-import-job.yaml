apiVersion: batch/v1
kind: Job
metadata:
  name: crowd-cult-backend-db-import
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: crowd-cult-backend-sa
      restartPolicy: Never
      containers:
        - name: db-import
          image: asia-south1-docker.pkg.dev/crowdandcult-prod/crowd-cult-backend/crowd-cult-backend:latest
          imagePullPolicy: Always
          command: ["/app/scripts/run-with-cloud-sql-proxy.sh"]
          args:
            - node
            - scripts/import-sql-dump.mjs
            - scripts/data/dump-crowdandcult-202605262143.sql
          env:
            - name: CLOUD_SQL_INSTANCE_CONNECTION_NAME
              value: crowdandcult-prod:asia-south1:crowd-cult-prod-sql
            - name: CONFIRM_DB_IMPORT
              value: "true"
          envFrom:
            - configMapRef:
                name: crowd-cult-backend-config
            - secretRef:
                name: crowd-cult-backend-secret
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
