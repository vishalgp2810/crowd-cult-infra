name: Deploy Crowd and Cult to GKE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        required: true
        options:
          - dev
          - prod
      backend_tag:
        description: "Backend image tag (e.g. sha-abc123)"
        required: true
        default: "latest"
      frontend_tag:
        description: "Frontend image tag (e.g. sha-abc123)"
        required: true
        default: "latest"
      admin_tag:
        description: "Admin image tag (e.g. sha-abc123)"
        required: true
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure kubectl access
        run: |
          if [ "${{ github.event.inputs.environment }}" = "prod" ]; then
            CLUSTER="${{ secrets.GKE_CLUSTER_PROD }}"
          else
            CLUSTER="${{ secrets.GKE_CLUSTER_DEV }}"
          fi
          gcloud container clusters get-credentials "$CLUSTER" --location "${{ secrets.GKE_LOCATION }}" --project "$GCP_PROJECT_ID"

      - name: Apply namespace and manifests
        run: |
          ENV="${{ github.event.inputs.environment }}"
          NS="crowd-cult-${ENV}"

          kubectl apply -f "k8s/${ENV}/namespace.yaml"
          kubectl apply -n "$NS" -f k8s/base/secrets.template.yaml
          kubectl apply -n "$NS" -f "k8s/${ENV}/configmaps.yaml"
          kubectl apply -n "$NS" -f k8s/base
          kubectl apply -n "$NS" -f "k8s/${ENV}/ingress.yaml"

      - name: Update deployment image tags
        run: |
          ENV="${{ github.event.inputs.environment }}"
          NS="crowd-cult-${ENV}"

          BACKEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/crowd-cult-backend/crowd-cult-backend:${{ github.event.inputs.backend_tag }}"
          FRONTEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/crowd-cult-frontend/crowd-cult-frontend:${{ github.event.inputs.frontend_tag }}"
          ADMIN_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/crowd-cult-admin/crowd-cult-admin:${{ github.event.inputs.admin_tag }}"

          kubectl -n "$NS" set image deployment/crowd-cult-backend backend="$BACKEND_IMAGE"
          kubectl -n "$NS" set image deployment/crowd-cult-frontend frontend="$FRONTEND_IMAGE"
          kubectl -n "$NS" set image deployment/crowd-cult-admin admin="$ADMIN_IMAGE"

      - name: Wait for rollout
        run: |
          ENV="${{ github.event.inputs.environment }}"
          NS="crowd-cult-${ENV}"

          kubectl -n "$NS" rollout status deployment/crowd-cult-backend --timeout=300s
          kubectl -n "$NS" rollout status deployment/crowd-cult-frontend --timeout=300s
          kubectl -n "$NS" rollout status deployment/crowd-cult-admin --timeout=300s
